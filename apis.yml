- type: Features
  data:
  - name: McKinsey Insights and McKinsey Quarterly
    description: McKinsey Insights aggregates the firm's research and commentary; McKinsey Quarterly is its flagship
      business journal, published continuously since 1964.
  - name: McKinsey Global Institute (MGI)
    description: MGI is McKinsey's business and economics research arm, publishing macroeconomic, productivity,
      and technology research used as long-horizon source material across the firm.
  - name: QuantumBlack, AI by McKinsey
    description: The firm's advanced analytics and AI division, acquired in 2015, delivering machine learning, generative
      AI, and agentic systems engagements; produces the State of AI survey and the QuantumBlack AI report.
  - name: McKinsey Digital
    description: The firm's digital transformation practice encompassing strategy, design, technology, cloud, cyber,
      data, and product engineering, and the home of QuantumBlack, Leap, and Technology.
  - name: Lilli generative-AI assistant
    description: McKinsey's internal generative-AI consultant assistant launched August 2023, indexing 100,000-plus
      internal documents and used by tens of thousands of firm employees.
  - name: Leap by McKinsey (business building)
    description: McKinsey's venture-building and corporate-incubation practice that co-creates new digital businesses
      with clients.
  - name: Open-source AI and data tooling
    description: Public open-source releases on github.com/mckinsey (Vizro, Agents-at-Scale ARK, ARK Marketplace,
      CausalNex, QuantumBlack Design System, qbstyles) and the LF-governed Kedro project at github.com/kedro-org.
  - name: Podcasts and books
    description: The McKinsey Podcast, McKinsey Talks Operations, McKinsey on AI, McKinsey on Books, and other audio
      and book programs distributing firm thought leadership.
- type: UseCases
  data:
  - name: Corporate and Growth Strategy
    description: C-suite advisory on corporate strategy, growth, M&A, portfolio, pricing, and capital allocation.
  - name: Operations Transformation
    description: Manufacturing, supply chain, procurement, and service-operations transformation engagements.
  - name: Digital and AI Transformation
    description: End-to-end digital and AI transformation delivered through McKinsey Digital and QuantumBlack, including
      model design, MLOps, agentic systems, and adoption programs.
  - name: Generative AI Programs
    description: Generative AI strategy, use-case identification, and at-scale deployment, including internal lessons
      from Lilli applied to client environments.
  - name: Risk, Resilience, and Cyber
    description: Enterprise risk, regulatory, resilience, and cybersecurity transformations.
  - name: Sustainability and Energy Transition
    description: Net-zero transition strategy, decarbonization roadmaps, and sustainability operating-model design
      through McKinsey Sustainability.
  - name: Business Building
    description: Greenfield digital-business creation, joint ventures, and incubation through Leap.
  - name: Public-Sector and Social-Sector Engagements
    description: National, state, and city government, plus social-sector and non-profit engagements; not exposed
      as a public API.
- type: Compliance
  data:
  - name: GDPR
    description: European personal-data processing aligns with the EU General Data Protection Regulation.
  - name: SOC 2
    description: McKinsey-managed digital products and managed-services environments operate under SOC 2-type controls.
  - name: ISO 27001
    description: McKinsey's information-security management aligns with ISO 27001 controls.
  - name: Client Confidentiality
    description: All engagements operate under master consulting agreements with strict confidentiality and conflict-management
      terms; the firm's professional standards are central to its IP and engagement protocols.
