meters:
  - name: engagement_contract
    description: >-
      Master engagement contract — not a metered unit; costs flow
      through time-and-materials, fixed-fee, or
      managed-services-subscription invoicing from the McKinsey
      engagement team.
    unit: contract
    aggregation: count
    dimensions:
      - client
      - practice
      - engagement_partner
principles:
  - name: Visibility
    description: >-
      Track McKinsey cost as professional-services spend on the client
      GL, not as a metered API line.
  - name: Allocation
    description: >-
      Allocate engagement cost to the sponsoring business unit;
      pass-through hyperscaler costs incurred during a McKinsey-led
      build or managed-services arrangement should be allocated
      through the underlying cloud bill rather than the McKinsey
      invoice.
  - name: Optimization
    description: >-
      Optimize by applying the same FinOps practices McKinsey advises
      clients to use on hyperscaler workloads, ensuring engagement
      scope and run-rate are consistent with the value being
      delivered.
  - name: Accountability
    description: >-
      Engagement sponsor on the client side and the McKinsey
      engagement partner share accountability for cost and value
      delivered.
maintainers:
