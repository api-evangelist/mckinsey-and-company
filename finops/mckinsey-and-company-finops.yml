description: >-
  McKinsey & Company has no public developer API and no metered billing
  surface. Costs flow through bilateral consulting engagement contracts
  and appear on client books as professional-services spend, not as
  metered API invoices. McKinsey itself advises clients on FinOps and
  cloud financial-management programs (often delivered through McKinsey
  Digital and QuantumBlack), but does not consume FinOps for its own
  corporate offerings. McKinsey-published open-source software is
  released free of charge under permissive licenses and does not enter
  the FinOps billing surface.
notes: >-
  No public developer API — placeholder only. McKinsey's FinOps practice
  is an advisory offering, not a billed McKinsey API product.
